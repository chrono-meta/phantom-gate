[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-gate"
version = "0.2.0"
description = "Universal AI output hallucination detection library - PMH seed bank"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "chrono.logy", email = "chrono.logy@kakaopaycorp.com"}
]
keywords = ["hallucination", "ai-verification", "qa", "testing", "harness-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
]

[project.scripts]
phantom-gate = "phantom_gate.cli:main"

[project.urls]
Homepage = "https://github.com/chrono-meta/phantom-gate"
Repository = "https://github.com/chrono-meta/phantom-gate"
Documentation = "https://github.com/chrono-meta/phantom-gate#readme"
"Bug Tracker" = "https://github.com/chrono-meta/phantom-gate/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["phantom_gate*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
